<script>

const API =
"https://script.google.com/macros/s/AKfycbyiDeeHBMrVg4KE3n0g4mhxjXZQ0T3shITi5APgJ531SguE_pZD1APvWgm39MjipUsNbQ/exec";



async function loadUsers(){

try{

const dropdown =
document.getElementById("name");

dropdown.innerHTML =
'<option>Select User</option>';

const res =
await fetch(
API + "?action=users"
);

const users =
await res.json();

users.forEach(function(u){

if(u.active){

dropdown.innerHTML +=
`<option value="${u.name}">
${u.name}
</option>`;

}

});

}
catch(e){

console.log(e);

}

}



async function login(){

try{

const name =
document.getElementById("name").value;

const pin =
document.getElementById("pin").value;

const msg =
document.getElementById("msg");


const res =
await fetch(
API,
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

action:"login",
name:name,
pin:pin

})

}
);


const data =
await res.json();


if(data.ok){

msg.innerHTML =
"Login Success";

}
else{

msg.innerHTML =
"Wrong PIN";

}

}
catch(e){

console.log(e);

}

}


window.onload =
function(){

loadUsers();

};

</script>
