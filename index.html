<script>

const API =
"https://script.google.com/macros/s/AKfycbyiDeeHBMrVg4KE3n0g4mhxjXZQ0T3shITi5APgJ531SguE_pZD1APvWgm39MjipUsNbQ/exec";


async function loadUsers(){

let dropdown =
document.getElementById("name");

dropdown.innerHTML =
'<option>Select User</option>';

let res =
await fetch(
API + "?action=users"
);

let users =
await res.json();


users.forEach(u=>{

if(u.active){

dropdown.innerHTML +=

`<option value="${u.name}">
${u.name}
</option>`;

}

});

}



async function login(){

let name =
document.getElementById("name").value;

let pin =
document.getElementById("pin").value;

let msg =
document.getElementById("msg");


let res =
await fetch(
API,
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

action:"login",
name:name,
pin:pin

})

}
);


let data =
await res.json();


if(data.ok){

msg.innerHTML =
"Login Success";

}
else{

msg.innerHTML =
"Wrong PIN";

}

}


loadUsers();

</script>
