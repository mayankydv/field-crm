<!DOCTYPE html>
<html>

<head>

<title>Dashboard</title>

<style>

body{

font-family:Arial;
background:#f4f4f4;
margin:0;

}

.top{

background:#1e88e5;
color:white;

padding:20px;

display:flex;

justify-content:
space-between;

align-items:center;

}

.container{

padding:30px;

}

.card{

background:white;

padding:20px;

border-radius:10px;

box-shadow:
0 5px 20px rgba(0,0,0,.1);

max-width:500px;

}

button{

padding:10px 20px;

background:red;

border:none;

color:white;

cursor:pointer;

}

</style>

</head>



<body>



<div class="top">

<h2>

Field CRM

</h2>


<button
onclick="logout()">

Logout

</button>


</div>



<div class="container">

<div class="card">

<h1>

Welcome,

<span id="user">

</span>

</h1>


<h3>

Role:

<span id="role">

</span>

</h3>


</div>

</div>




<script>


if(

!localStorage.getItem(
"user"
)

){

window.location =
"index.html";

}



document.getElementById(
"user"
).innerHTML =

localStorage.getItem(
"user"
);



document.getElementById(
"role"
).innerHTML =

localStorage.getItem(
"role"
);



function logout(){

localStorage.clear();

window.location =
"index.html";

}


</script>



</body>

</html>
