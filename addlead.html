<!DOCTYPE html>
<html>
<head>

<title>Add Lead</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
padding:30px;
}

.card{
background:white;
padding:25px;
max-width:500px;
margin:auto;
border-radius:10px;
}

input,
button{

width:100%;
padding:12px;
margin-top:10px;
box-sizing:border-box;

}

button{

background:#1e88e5;
color:white;
border:none;

}

</style>

</head>


<body>


<div class="card">

<h2>

Add Lead

</h2>


<input
id="organisation"
placeholder="Organisation">


<input
id="poc1"
placeholder="POC1">


<input
id="poc2"
placeholder="POC2">


<input
id="audienceType"
placeholder="Audience Type">


<button
onclick="saveLead()">

Save Lead

</button>


<p id="msg">

</p>


</div>



<script>


const API =

"https://script.google.com/macros/s/AKfycbyiDeeHBMrVg4KE3n0g4mhxjXZQ0T3shITi5APgJ531SguE_pZD1APvWgm39MjipUsNbQ/exec";



async function saveLead(){

const msg =
document.getElementById(
"msg"
);

try{

const res =
await fetch(

API,

{

method:"POST",

headers:{

"Content-Type":
"application/json"

},

body:

JSON.stringify({

action:
"addLead",

organisation:

document
.getElementById(
"organisation"
)
.value,


poc1:

document
.getElementById(
"poc1"
)
.value,


poc2:

document
.getElementById(
"poc2"
)
.value,


audienceType:

document
.getElementById(
"audienceType"
)
.value,


owner:

localStorage.user

})

}

);


const data =
await res.json();


if(data.ok){

msg.innerHTML =
"Lead Saved";

msg.style.color =
"green";

}
else{

msg.innerHTML =
"Error";

}


}
catch(e){

console.log(e);

msg.innerHTML =
"Server Error";

msg.style.color =
"red";

}

}

</script>



</body>

</html>
